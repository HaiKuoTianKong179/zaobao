<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>懂球帝早报</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f4f6f8; color: #333; padding: 24px 12px;
  }
  .box { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; text-align: center; margin-bottom: 20px; }
  h2 { font-size: 15px; color: #666; margin: 18px 0 8px; }
  .dates { display: flex; flex-direction: column; gap: 6px; }
  .dates label {
    display: flex; align-items: baseline; gap: 8px;
    background: #fff; border: 2px solid transparent; border-radius: 8px;
    padding: 10px 12px; cursor: pointer;
  }
  .dates label:has(input:checked) { border-color: #16a13f; background: #f0faf3; }
  .dates .d { font-weight: bold; white-space: nowrap; }
  .dates .t { font-size: 13px; color: #888; overflow: hidden;
              text-overflow: ellipsis; white-space: nowrap; }
  input[type="radio"] { accent-color: #16a13f; margin-right: 4px; }
  .hint {
    font-size: 13px; color: #666; background: #eef4f0;
    border-radius: 8px; padding: 9px 12px; margin-top: 18px;
  }
  button {
    display: block; width: 100%; margin-top: 24px;
    background: #16a13f; color: #fff; border: none; border-radius: 8px;
    padding: 13px; font-size: 17px; cursor: pointer;
  }
  button:disabled { background: #9ccaae; cursor: default; }
  .error {
    background: #fdecea; color: #b3261e; border-radius: 8px;
    padding: 12px; text-align: center; white-space: pre-wrap;
  }
  .back { display: block; text-align: center; margin-top: 14px; color: #16a13f; }
</style>
</head>
<body>
<div class="box">
  <h1>懂球帝早报</h1>
  {% if error %}
    <p class="error">{{ error }}</p>
    <a class="back" href="/">← 重试</a>
  {% else %}
  <form action="/open" method="get" id="f">
    <h2>请选择日期</h2>
    <div class="dates">
      {% for r in reports %}
      <label>
        <input type="radio" name="date" value="{{ r.date }}"
               {% if loop.first %}checked{% endif %}>
        <span class="d">{{ r.date }}</span>
        <span class="t">{{ r.title }}</span>
      </label>
      {% endfor %}
    </div>
    <p class="hint">已根据设备自动选择:{{ "手机版" if version == "mobile" else "电脑版" }}</p>
    <button type="submit" id="go">打开早报</button>
  </form>
  {% endif %}
</div>
<script>
// 提交后给出等待提示(抓取+转换需要几秒)
document.getElementById('f') && document.getElementById('f').addEventListener(
  'submit', function () {
    var b = document.getElementById('go');
    b.disabled = true;
    b.textContent = '正在获取早报,请稍候…';
  });
</script>
</body>
</html>
